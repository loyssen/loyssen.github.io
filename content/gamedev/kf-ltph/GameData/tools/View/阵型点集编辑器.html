<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>阵型点集编辑器</title>
<style>
:root{--bg:#1e222a;--surface:#242933;--surface2:#2a303c;--border:#3a4150;--fg:#e8ebf1;--muted:#98a1b3;--accent:#2563eb;--accent-h:#3b82f6;--accent-dim:rgba(37,99,235,.16);--ok:#34d399;--ok-bg:rgba(52,211,153,.10);--err:#f87171;--err-bg:rgba(248,113,113,.10);--warn:#fbbf24;--warn-bg:rgba(251,191,36,.08);--r:4px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;padding:4px 12px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface2);color:var(--fg);cursor:pointer;white-space:nowrap}
button:hover:not(:disabled){border-color:var(--accent-h)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover:not(:disabled){background:var(--accent-h);border-color:var(--accent-h)}
input[type=number],input[type=text],select{font:inherit;padding:3px 8px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface2);color:var(--fg)}
input[type=number]{width:64px}
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--border);padding:8px 16px}
.brand{font-size:14px;font-weight:600;margin-right:4px;white-space:nowrap}
.brand .docname{font-weight:400;color:var(--muted);margin-left:8px;font-size:12px}
.tsep{width:1px;height:20px;background:var(--border);margin:0 4px;flex:none}
.tgroup{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tlabel{font-size:11px;color:var(--muted);white-space:nowrap}
.chk{display:inline-flex;gap:4px;align-items:center;color:var(--muted);font-size:12px;white-space:nowrap;cursor:pointer}
.chk input{margin:0}
.stat{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;white-space:nowrap}
.dwstat{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}
#dwSel{max-width:220px;min-width:120px}
#applyBtn{font-weight:600}
.main{flex:1;display:flex;min-height:0}
.stage{flex:1;min-width:0;overflow:auto;padding:16px;display:flex;justify-content:center;align-items:flex-start}
svg{width:100%;height:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);touch-action:none;cursor:crosshair}
.main.noside .side{display:none}
.side{width:304px;flex:none;background:var(--surface);border-left:1px solid var(--border);overflow-y:auto;padding:12px}
.sidehead{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.05em;margin:4px 0 8px}
.sec{margin-bottom:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.hint{color:var(--muted);font-size:11px;margin:4px 0}
.group{display:flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--border);border-radius:var(--r);cursor:pointer;background:var(--surface2)}
.group.active{border-color:var(--accent);background:var(--accent-dim)}
.group .gname{flex:1;min-width:0}
input[type=text].gname{width:100%;border:none;background:transparent;padding:0;color:var(--fg);font:inherit}
select.gfish{padding:2px 4px;font-size:12px;max-width:110px}
.addbtn{flex:none;width:22px;height:22px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface2);color:var(--accent);cursor:pointer;font-size:13px;line-height:1;padding:0}
.addbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.sw{width:10px;height:10px;border-radius:50%;flex:none}
.cnt{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.vline{font-size:12px}
.statusbar{display:flex;align-items:center;gap:16px;background:var(--surface);border-top:1px solid var(--border);padding:0 16px;min-height:32px;font-size:12px;color:var(--muted);flex:none}
.statusbar .state{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.statusbar .state b{color:var(--fg)}
.statusbar .msg{flex:none;max-width:72%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.statusbar .msg.ok{color:var(--ok)}.statusbar .msg.err{color:var(--err)}.statusbar .msg.warn{color:var(--warn)}.statusbar .msg.info{color:var(--fg)}
.statusbar.t-ok{background:var(--ok-bg)}.statusbar.t-err{background:var(--err-bg)}.statusbar.t-warn{background:var(--warn-bg)}
.statusbar.grow{display:block;min-height:32px;max-height:180px;overflow-y:auto;padding:6px 16px}
.statusbar.grow .state{display:none}
.statusbar.grow .msg{display:block;max-width:none;white-space:pre-wrap;text-align:left;font:11px/1.5 ui-monospace,Consolas,monospace}

/* 滑轮缩放自适应（配合页尾 zoomfit 脚本）：zfit 时 body 固定为虚拟视口尺寸；窄时侧栏转下方面板 */
html.zfit{overflow:hidden}
html.zfit body{width:var(--vwidth);height:var(--vheight)}
.zfit-narrow .main{flex-direction:column}
.zfit-narrow .side{width:auto;max-height:46%;border-left:none;border-top:1px solid var(--border)}
</style>
</head>
<body>
<header class="topbar">
 <span class="brand">阵型点集编辑器<span class="docname" id="docName"></span></span>
 <div class="tsep"></div>
 <div class="tgroup"><button id="reset" title="放弃未保存修改，恢复最近一次从多维表格载入的内容">重置</button></div>
 <div class="tsep"></div>
 <div class="tgroup">
  <button id="undo" title="撤销 (Ctrl+Z)">撤销</button>
  <button id="redo" title="重做 (Ctrl+Y / Ctrl+Shift+Z)">重做</button>
  <button id="del" title="删除当前选中的点">删除选中</button>
 </div>
 <div class="tsep"></div>
 <div class="tgroup">
  <label class="chk"><input id="snap" type="checkbox"> 吸附 0.5</label>
  <label class="chk">间距阈值 <input id="spacing" type="number" step="0.1" min="0.2" max="3" value="1.0"></label>
  <span class="stat" id="total"></span>
 </div>
 <div class="tsep"></div>
 <div class="tgroup">
  <span class="tlabel">多维表格</span>
  <button id="dwConn" title="连接本地服务并拉取条目清单（启动：Obsidian 侧边栏 ▶「数据管线启动器」或双击 GameData/tools/Program/start.bat，默认 127.0.0.1:8712）">连接桥</button>
  <span class="dwstat"><i class="dot warn" id="dwDot"></i><span id="dwStat">未连接</span></span>
  <select id="dwSel"><option value="">条目…</option></select>
  <button id="dwLoad" title="载入选中条目的 Offsets 到画布（替换当前画布，几何文本已按 Fmt-R 规范化）">载入</button>
  <button id="dwSave" class="primary" title="把当前活动组点位写回选中条目（最小手术：仅改 Offsets+revision+updatedAt，桥写后重读断言）">保存到多维表格</button>
 </div>
 <div class="tsep"></div>
 <div class="tgroup">
  <button id="applyBtn" class="primary" title="直出应用：.duowei → json + C#（duowei_export 直出，经本地服务执行，最长 5 分钟）">应用数据到游戏</button>
  <button id="sideToggle" title="显示/隐藏侧栏">侧栏</button>
 </div>
</header>
<div class="main" id="main">
 <div class="stage">
  <svg id="svg" viewBox="-16 -9 32 18" tabindex="0">
    <g id="grid"></g>
    <g id="points" transform="scale(1,-1)"></g>
  </svg>
 </div>
 <aside class="side">
  <div class="sec">
   <div class="sidehead">鱼群分组</div>
   <div class="hint">点行=切换活动组 · ＋=设为添加组 · 双击画布=加到添加组 · 右键/Delete=删点 · 拖拽移动 · 方向键微调(Shift=1格) · 框选/Shift=多选</div>
   <div id="groups" style="display:flex;flex-direction:column;gap:4px;max-height:260px;overflow:auto;margin:8px 0"></div>
   <div class="row">
    <button id="addgroup">＋新建组</button>
    <button id="delgroup">删除组</button>
    <button id="mirx">镜像X</button>
    <button id="miry">镜像Y</button>
    <button id="clearg">清空组</button>
   </div>
  </div>
  <div class="sec">
   <div class="sidehead">校验</div>
   <div id="valid" style="max-height:150px;overflow:auto"></div>
  </div>
 </aside>
</div>
<footer class="statusbar" id="statusbar">
 <span class="state" id="statusState"></span>
 <span class="msg" id="msg"></span>
</footer>
<script>
(function(){
const PAL={series1:'#3b82f6',series2:'#ef4444',series3:'#22c55e',series4:'#f59e0b',series5:'#a855f7',series6:'#14b8a6'};
const FISHES=[
 {id:'1001',name:'小剑鱼',color:'#f59e0b'},{id:'1002',name:'凤尾鱼',color:'#8b5cf6'},{id:'1003',name:'蝴蝶鱼',color:'#3b82f6'},
 {id:'1004',name:'海马',color:'#14b8a6'},{id:'1005',name:'尖嘴鱼',color:'#64748b'},{id:'1006',name:'神仙鱼',color:'#10b981'},
 {id:'1007',name:'小丑鱼',color:'#eab308'},{id:'1008',name:'乌贼',color:'#7c3aed'},{id:'1009',name:'电鳗',color:'#22d3ee'},
 {id:'1010',name:'刺豚',color:'#f472b6'},{id:'2005',name:'虾',color:'#f97316'},{id:'2006',name:'金钱龟',color:'#fbbf24'},
 {id:'2007',name:'食人鱼',color:'#ef4444'},{id:'2009',name:'狂战先锋',color:'#a21caf'},
 {id:'3001',name:'黄金龟',color:'#f59e0b'},{id:'3002',name:'金蟾',color:'#fbbf24'},{id:'3003',name:'金墨鱼',color:'#facc15'},
 {id:'3004',name:'金鲨鱼',color:'#fde047'},{id:'3006',name:'金灯笼鱼',color:'#fef08a'},{id:'3007',name:'聚宝盆',color:'#fde047'},
 {id:'3008',name:'龙转盘',color:'#facc15'},{id:'3009',name:'密码桶',color:'#eab308'},{id:'3011',name:'紫金葫芦',color:'#f59e0b'},
 {id:'3012',name:'玉玺',color:'#fde047'},{id:'3013',name:'螃蟹',color:'#fb923c'}];
const fishById=Object.fromEntries(FISHES.map(f=>[f.id,f]));
const $=id=>document.getElementById(id);
let S=null,selSet=new Set(),active=0,drag=null,rect=null,rectShift=false,dragInit=[];
let hist=[],histIdx=-1,histMax=60;
let loadedBackup=null,loadedLabel=''; // 最近一次从多维表格载入的内容（「重置」恢复基准）
const cloneS=()=>JSON.parse(JSON.stringify(S));
function pushHist(){if(!S)return;hist=hist.slice(0,histIdx+1);hist.push(cloneS());if(hist.length>histMax)hist.shift();histIdx=hist.length-1;saveDraft();}
function undo(){if(histIdx<=0)return;histIdx--;S=JSON.parse(JSON.stringify(hist[histIdx]));selSet=new Set();active=Math.min(active,S.groups.length-1);render();}
function redo(){if(histIdx>=hist.length-1)return;histIdx++;S=JSON.parse(JSON.stringify(hist[histIdx]));selSet=new Set();active=Math.min(active,S.groups.length-1);render();}
const DRAFT_KEY='cf-draft-v1';
function saveDraft(){try{localStorage.setItem(DRAFT_KEY,JSON.stringify({t:Date.now(),s:S}));}catch(e){}}function loadDraft(){try{const r=localStorage.getItem(DRAFT_KEY);if(!r)return null;const o=JSON.parse(r);return o&&o.s&&o.s.groups?o.s:null;}catch(e){return null;}}
function clearDraft(){try{localStorage.removeItem(DRAFT_KEY);}catch(e){}}
const key=h=>h.gi+','+h.pi;
const sample=()=>{const pts=[];for(let y=-7.5;y<=7.5;y+=5)for(let x=-7.5;x<=7.5;x+=5)pts.push([x,y]);return{name:'4×4 填充',stage:'9101_阶段3_4x4填充',groups:[{fishId:'1001',name:'小剑鱼',color:'series1',points:pts},{fishId:'1004',name:'神仙鱼',color:'series2',points:[[-1.5,1.5],[1.5,1.5],[-1.5,-1.5],[1.5,-1.5]]}]};};
const colorVar=c=>c&&c.startsWith('#')?c:(PAL[c]||PAL.series1);
function esc2(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function renderGrid(){let h='';for(let x=-16;x<=16;x++)h+='<line x1="'+x+'" y1="-9" x2="'+x+'" y2="9" stroke="var(--border)" stroke-width="0.06" opacity="'+(x===0?0.9:0.35)+'"/>';for(let y=-9;y<=9;y++)h+='<line x1="-16" y1="'+y+'" x2="16" y2="'+y+'" stroke="var(--border)" stroke-width="0.06" opacity="'+(y===0?0.9:0.35)+'"/>';$('grid').innerHTML=h;}
function render(){if(!S)return;
 $('docName').textContent=(S.name||'未命名')+(S.stage?' · '+S.stage:'');
 let h='';S.groups.forEach((g,gi)=>{const col=colorVar(g.color);g.points.forEach((pt,pi)=>{const act=selSet.has(gi+','+pi);h+='<circle cx="'+pt[0]+'" cy="'+pt[1]+'" r="'+(act?0.62:0.45)+'" fill="'+(act?'none':col)+'" stroke="'+(act?'var(--accent)':col)+'" stroke-width="'+(act?0.16:0)+'" opacity="0.9"/>';});});
 if(rect){const x0=Math.min(rect.x0,rect.x1),y0=Math.min(rect.y0,rect.y1),w=Math.abs(rect.x1-rect.x0),ht=Math.abs(rect.y1-rect.y0);h+='<rect x="'+x0+'" y="'+y0+'" width="'+w+'" height="'+ht+'" fill="var(--accent)" opacity="0.12" stroke="var(--accent)" stroke-width="0.08" stroke-dasharray="0.3 0.2"/>';}
 $('points').innerHTML=h;renderGroups();renderValid();renderStatus();
 $('total').textContent=S.groups.reduce((a,g)=>a+g.points.length,0)+' 点';
 $('undo').disabled=histIdx<=0;$('redo').disabled=histIdx>=hist.length-1;}
function renderStatus(){const st=$('statusState'),ag=S.groups[active]||S.groups[0]||{color:'#94a3b8',name:'（无组）'};
 let t='添加组：<span class="sw" style="display:inline-block;background:'+colorVar(ag.color)+';vertical-align:middle"></span> <b>'+esc2(ag.name||ag.fishId||('组'+(active+1)))+'</b>（双击画布加此组）';
 if(selSet.size){t+='　·　已选中 <b>'+selSet.size+'</b> 点';if(selSet.size===1){const k=[...selSet][0].split(','),g=S.groups[+k[0]],p=g&&g.points[+k[1]];if(g&&p)t+='（<b>'+esc2(g.name||'组'+(+k[0]+1))+'</b> '+p[0]+','+p[1]+'）';}}
 t+='　·　来源：'+esc2(loadedLabel||'示例/草稿');
 st.innerHTML=t;}
function setMsg(t,kind){const sb=$('statusbar'),m=$('msg');m.textContent=t;m.className='msg '+(kind||'info');
 sb.className='statusbar'+(kind==='ok'?' t-ok':kind==='err'?' t-err':kind==='warn'?' t-warn':'')+(t.length>140?' grow':'');
 if(sb.classList.contains('grow'))sb.scrollTop=0;}
function renderGroups(){const el=$('groups');
 const sig=S.groups.map((g,i)=>i+':'+(i===active?1:0)+':'+g.points.length+':'+(g.name||'')).join('|');
 if(el.dataset.sig===sig)return;el.dataset.sig=sig;
 el.innerHTML='';S.groups.forEach((g,i)=>{const d=document.createElement('div');d.className='group'+(i===active?' active':'');d.dataset.i=i;d.innerHTML='<span class="sw" style="background:'+colorVar(g.color)+'"></span><select class="gfish" data-i="'+i+'" title="鱼种"><option value="">--鱼种--</option>'+FISHES.map(f=>'<option value="'+f.id+'"'+(String(g.fishId)===f.id?' selected':'')+'>'+f.id+' '+f.name+'</option>').join('')+'</select><input class="gname" data-i="'+i+'" value="'+esc2(g.name||'')+'" title="鱼种名（可改）"><span class="cnt">'+g.points.length+' 点</span><button class="addbtn'+(i===active?' on':'')+'" data-i="'+i+'" title="设为添加组">＋</button>';el.appendChild(d);});}
const groupsEl=$('groups');
groupsEl.addEventListener('click',e=>{
 const ab=e.target.closest('.addbtn');if(ab){active=+ab.dataset.i;render();return;}
 const row=e.target.closest('.group');if(row&&!e.target.closest('input')){active=+row.dataset.i;selSet=new Set();render();}});
groupsEl.addEventListener('change',e=>{if(e.target.matches('.gfish')){const g=S.groups[+e.target.dataset.i],f=fishById[e.target.value];if(!g)return;if(f){g.fishId=f.id;g.name=f.name;g.color=f.color;}else{g.fishId='';}pushHist();render();return;}
 if(e.target.matches('.gname')){const g=S.groups[+e.target.dataset.i];if(g){g.name=e.target.value;pushHist();renderStatus();}}});
function renderValid(){const el=$('valid'),sp=parseFloat($('spacing').value)||1.0,errs=[],warns=[];let total=0;
 S.groups.forEach((g,gi)=>{total+=g.points.length;for(let i=0;i<g.points.length;i++)for(let j=i+1;j<g.points.length;j++){const dx=g.points[i][0]-g.points[j][0],dy=g.points[i][1]-g.points[j][1],d=Math.hypot(dx,dy);if(d<sp-1e-9)errs.push('组'+(gi+1)+' 点'+i+'/'+j+' 间距 '+d.toFixed(2)+' < '+sp.toFixed(1));}g.points.forEach(pt=>{if(Math.abs(pt[0])>16||Math.abs(pt[1])>9)warns.push('组'+(gi+1)+' ('+pt[0]+','+pt[1]+') 超出视场');});});
 for(let a=0;a<S.groups.length;a++)for(let b=a+1;b<S.groups.length;b++)S.groups[a].points.forEach(pa=>S.groups[b].points.forEach(pb=>{const d=Math.hypot(pa[0]-pb[0],pa[1]-pb[1]);if(d<0.5)warns.push('组'+(a+1)+'/'+(b+1)+' 跨组重叠 d='+d.toFixed(2));}));
 let h='';if(!errs.length&&!warns.length)h='<div class="vline" style="color:var(--ok)">✓ 校验通过（'+total+' 点）</div>';errs.forEach(e=>h+='<div class="vline" style="color:var(--err)">✗ '+e+'</div>');warns.forEach(w=>h+='<div class="vline" style="color:var(--warn)">⚠ '+w+'</div>');el.innerHTML=h;}
function toGame(ev){const r=$('svg').getBoundingClientRect();return[(ev.clientX-r.left)/r.width*32-16,9-(ev.clientY-r.top)/r.height*18];}
const snap=v=>$('snap').checked?Math.round(v*2)/2:v;
function hit(px,py){for(let gi=0;gi<S.groups.length;gi++)for(let pi=0;pi<S.groups[gi].points.length;pi++){const p=S.groups[gi].points[pi];if(Math.hypot(p[0]-px,p[1]-py)<0.7)return{gi,pi};}return null;}
$('svg').addEventListener('pointerdown',e=>{if(!S)return;$('svg').focus();const[gx,gy]=toGame(e),h=hit(gx,gy);
 if(e.button===2)return;
 if(h){const k=key(h);if(e.shiftKey){selSet.has(k)?selSet.delete(k):selSet.add(k);}else{if(!selSet.has(k))selSet=new Set([k]);drag={g:h.gi,p:h.pi,ox:gx,oy:gy};dragInit=[...selSet].map(k=>{const s=k.split(','),g=S.groups[+s[0]],p=g.points[+s[1]];return{x:p[0],y:p[1]};});}}
 else{if(!e.shiftKey)selSet=new Set();rect={x0:gx,y0:gy,x1:gx,y1:gy};rectShift=e.shiftKey;}
 render();e.preventDefault();});
window.addEventListener('pointermove',e=>{if(drag){const[gx,gy]=toGame(e),dx=snap(gx-drag.ox),dy=snap(gy-drag.oy);let i=0;selSet.forEach(k=>{const s=k.split(','),p=S.groups[+s[0]].points[+s[1]],o=dragInit[i++];if(o){p[0]=Math.round((o.x+dx)*100)/100;p[1]=Math.round((o.y+dy)*100)/100;}});render();return;}
 if(rect){const[gx,gy]=toGame(e);rect.x1=gx;rect.y1=gy;render();}});
window.addEventListener('pointerup',()=>{if(rect&&!drag){const x0=Math.min(rect.x0,rect.x1),x1=Math.max(rect.x0,rect.x1),y0=Math.min(rect.y0,rect.y1),y1=Math.max(rect.y0,rect.y1),add=[];S.groups.forEach((g,gi)=>g.points.forEach((p,pi)=>{if(p[0]>=x0&&p[0]<=x1&&p[1]>=y0&&p[1]<=y1)add.push(gi+','+pi);}));if(add.length)selSet=rectShift?new Set([...selSet,...add]):new Set(add);}
 const dirty=!!(drag||rect);if(drag)pushHist();drag=null;rect=null;dragInit=[];if(dirty)render();});
$('svg').addEventListener('contextmenu',e=>{if(!S)return;e.preventDefault();const[gx,gy]=toGame(e),h=hit(gx,gy);if(!h)return;
 pushHist();
 S.groups[h.gi].points.splice(h.pi,1);
 const ns=new Set();selSet.forEach(k=>{const s=k.split(','),gi=+s[0],pi=+s[1];if(gi!==h.gi){ns.add(k);}else if(pi>h.pi){ns.add(gi+','+(pi-1));}else if(pi!==h.pi){ns.add(k);}});selSet=ns;
 render();});
function delSelected(){if(!S||!selSet.size)return;pushHist();const items=[...selSet].map(k=>{const s=k.split(',');return{g:+s[0],p:+s[1]};}).sort((a,b)=>a.g-b.g||b.p-a.p);items.forEach(it=>{S.groups[it.g].points.splice(it.p,1);});selSet=new Set();render();}
$('svg').addEventListener('dblclick',e=>{if(!S)return;if(!S.groups.length)return;const[gx,gy]=toGame(e);if(hit(gx,gy))return;pushHist();S.groups[active].points.push([snap(gx),snap(gy)]);selSet=new Set([active+','+(S.groups[active].points.length-1)]);render();});
$('svg').addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return;}
 if(e.key==='Delete'||e.key==='Backspace'){delSelected();e.preventDefault();return;}
 if(!selSet.size)return;const st=e.shiftKey?1:0.1,dir=e.key==='ArrowLeft'?[-st,0]:e.key==='ArrowRight'?[st,0]:e.key==='ArrowUp'?[0,st]:e.key==='ArrowDown'?[0,-st]:null;if(!dir)return;
 selSet.forEach(k=>{const s=k.split(','),p=S.groups[+s[0]].points[+s[1]];p[0]+=dir[0];p[1]+=dir[1];});e.preventDefault();render();});
$('spacing').addEventListener('input',renderValid);
$('del').onclick=delSelected;
const curGroup=()=>{if(!S.groups[active])active=0;return S.groups[active];};
$('addgroup').onclick=()=>{if(!S)return;pushHist();const f=FISHES[0];S.groups.push({fishId:f.id,name:f.name,color:f.color,points:[]});active=S.groups.length-1;render();};
$('mirx').onclick=()=>{if(!S)return;pushHist();curGroup().points=curGroup().points.map(p=>[-p[0],p[1]]);render();};
$('miry').onclick=()=>{if(!S)return;pushHist();curGroup().points=curGroup().points.map(p=>[p[0],-p[1]]);render();};
$('clearg').onclick=()=>{if(!S)return;pushHist();curGroup().points=[];render();};
$('delgroup').onclick=()=>{if(!S||S.groups.length<=1)return;pushHist();S.groups.splice(active,1);if(active>=S.groups.length)active=S.groups.length-1;selSet=new Set();render();};
function applyData(d,src){S=d;selSet=new Set();active=0;hist=[];histIdx=-1;pushHist();render();}
$('reset').onclick=()=>{if(loadedBackup){applyData(JSON.parse(JSON.stringify(loadedBackup)),'reset');setMsg('已重置为最近载入的内容（'+esc2(loadedLabel)+'）','ok');}else setMsg('尚未从多维表格载入条目，无内容可重置（当前画布为示例/草稿）','warn');};
$('undo').onclick=undo;
$('redo').onclick=redo;
$('sideToggle').onclick=()=>{$('main').classList.toggle('noside');};
S=sample();
const draft=loadDraft();
if(draft&&draft.groups&&draft.groups.length)S=draft; // 静默恢复草稿（无提示条）
hist=[];histIdx=-1;pushHist();renderGrid();render();
// ── 多维表格 .duowei 桥接（唯一数据通路）：本地服务 server.py（默认 127.0.0.1:8712；?dwport=xxxx 或 localStorage dwBridgePort 覆盖）──
// 仅几何字段 Offsets 经服务读写（Name/Id/Shape 在 Obsidian 侧维护）；服务端最小手术+Fmt-R 与 duowei_sync.py 同源
const DW_PORT=(()=>{const q=new URLSearchParams(location.search).get('dwport');if(q)return q;try{return localStorage.getItem('dwBridgePort')||'8712';}catch(e){return '8712';}})();
let DW_CONNECTED=false;
// 从服务打开时用同源相对路径请求（不绑定主机/端口）；file:// 打开时走本地服务绝对地址
const DW_BASE=location.protocol.startsWith('http')?'':('http://127.0.0.1:'+DW_PORT);
const dwBridgeDownMsg='服务未启动：Obsidian 侧边栏 ▶「数据管线启动器」或双击 GameData/tools/Program/start.bat（默认端口 8712；用法见 GameData/README.md）';
function dwStat(t,cls){$('dwStat').textContent=t;$('dwDot').className='dot '+(cls||'');}
async function dwApi(path,opt){
 // 3 秒超时防挂起无反馈（AbortError 转成明确人话提示）
 const ac=new AbortController();const timer=setTimeout(()=>ac.abort(),3000);
 let r;
 try{
  r=await fetch(DW_BASE+path,Object.assign({mode:'cors',signal:ac.signal},opt||{}));
 }catch(e){
  if(e&&e.name==='AbortError')throw new Error('服务未响应（3秒超时）——确认工具窗口在跑（tools/Program/start.bat）');
  throw e;
 }finally{clearTimeout(timer);}
 const j=await r.json();
 if(!j.ok)throw new Error(j.error||('HTTP '+r.status));
 return j;}
const dwSel=$('dwSel');
async function dwRefresh(){
 try{
  const j=await dwApi('/list?table=formation');
  dwSel.innerHTML='<option value="">条目 '+j.count+' …</option>'+j.items.map(it=>'<option value="'+esc2(it.id)+'">'+esc2(it.name)+'</option>').join('');
  DW_CONNECTED=true;dwStat('已连接 '+j.count+' 条','ok');
  setMsg('多维表格桥已连接（阵型 '+j.count+' 条 · '+(DW_BASE||location.origin)+' · 编辑期间建议别在 Obsidian 同时改该表）','ok');
 }catch(e){dwStat('未连接','warn');
  throw e;}}
$('dwConn').onclick=()=>{dwRefresh().catch(e=>setMsg('连接失败：'+e.message+'　·　'+dwBridgeDownMsg,'err'));};
$('dwLoad').onclick=async()=>{
 const id=dwSel.value;
 if(!id){setMsg('请先在下拉选择要载入的条目（未连接先点「连接桥」）','warn');return;}
 if(S&&S.groups&&S.groups.some(g=>g.points.length)&&!confirm('将载入条目替换当前画布（未保存修改会丢失），继续？'))return;
 try{
  const j=await dwApi('/record?table=formation&id='+encodeURIComponent(id));
  const rec=j.record;
  const pts=JSON.parse(rec.Offsets||'[]').map(p=>[+p.x,+p.y]);
  if(!pts.length)throw new Error('该条目 Offsets 为空');
  const d={name:rec.Name,stage:'',groups:[{fishId:'',name:rec.Name,color:'series1',points:pts}]};
  loadedBackup=JSON.parse(JSON.stringify(d));loadedLabel='多维表格：'+rec.Name;
  applyData(d,'duowei');
  setMsg('已从多维表格载入「'+esc2(rec.Name)+'」（'+pts.length+' 点 · Id '+esc2(rec.Id)+'）','ok');
 }catch(e){setMsg('多维表格载入失败：'+esc2(e.message)+'　·　'+esc2(dwBridgeDownMsg),'err');}};
$('dwSave').onclick=async()=>{
 const id=dwSel.value;
 if(!id){setMsg('请先在下拉选择保存目标条目（未连接先点「连接桥」）','warn');return;}
 if(!S||!S.groups||!S.groups.some(g=>g.points.length)){setMsg('画布为空，无可保存点位','warn');return;}
 const g=S.groups[active]||S.groups[0];
 if(S.groups.length>1&&!confirm('当前画布有 '+S.groups.length+' 个组，将只保存活动组「'+(g.name||('组'+(active+1)))+'」到选中条目，继续？'))return;
 const offsets=g.points.map(p=>({x:Math.round(p[0]*1e4)/1e4,y:Math.round(p[1]*1e4)/1e4}));
 try{
  const j=await dwApi('/record',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({table:'formation',id:id,fields:{Offsets:JSON.stringify(offsets)}})});
  setMsg('已保存 '+offsets.length+' 点到多维表格「'+esc2((dwSel.options[dwSel.selectedIndex]||{}).text||'')+'」（服务已重读断言一致；落地：点「应用数据到游戏」直出，见 GameData/README.md）','ok');
 }catch(e){setMsg('多维表格保存失败：'+esc2(e.message)+'　·　'+esc2(dwBridgeDownMsg),'err');}};
// 应用数据到游戏：POST /apply 直出（.duowei→json+C#；服务端并发保护+300s 超时）
$('applyBtn').onclick=async()=>{
 const b=$('applyBtn');
 b.disabled=true;b.textContent='应用中…（最长 5 分钟）';
 setMsg('直出执行中：.duowei → json + C#（duowei_export，经本地服务 '+(DW_BASE||location.origin)+'）','info');
 try{
  const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),300000);
  const r=await fetch(DW_BASE+'/apply',{method:'POST',signal:ctl.signal});
  clearTimeout(tm);
  const j=await r.json();
  setMsg((j.ok?'[OK] 导出通过\n':'[FAIL] 未通过\n')+(j.output||j.error||''),j.ok?'ok':'err');
 }catch(e){
  setMsg('[FAIL] 请求失败：'+e.message+'（可能：服务未启动——双击 tools/Program/start.bat）','err');
 }
 b.disabled=false;b.textContent='应用数据到游戏';};
// 实测连接为准（不静态猜测宿主）：任何环境先尝试连接，失败才提示（Obsidian 内置预览 CSP 拦 localhost fetch，需系统浏览器/Unrestricted Mode 打开）
setMsg('拖拽移动 · 框选/Shift 多选 · 双击加点 · 右键删点 · 方向键微调(Shift=1格) · Ctrl+Z 撤销','info');
dwRefresh().catch(()=>{}).then(()=>{
 if(!DW_CONNECTED){
  setMsg('无法连接本地服务（127.0.0.1:8712）：① 服务未启动——双击 tools/Program/start.bat；② Obsidian 内置预览沙箱拦本地 fetch——用系统浏览器（Chrome/Edge）打开本页面','warn');
 }
});
})();
</script>

<script>
// 滑轮缩放自适应：HTML Reader 的缩放是给 html 元素加 transform:scale（视口宽度不变、
// 媒体查询不触发、放大后右/下溢出不可达）。此处读取该缩放值，把虚拟视口（实际宽高÷缩放）
// 写入 --vwidth/--vheight 并打 .zfit / .zfit-narrow 标记，布局据此重排为恰好铺满可见区。
(function(){
 var last=-1;
 function zf(){
  var t=getComputedStyle(document.documentElement).transform;
  if(!t||t==="none")return 1;
  var m=t.match(/matrix\(([^)]+)\)/);
  if(!m)return 1;
  var a=parseFloat(m[1].split(",")[0]);
  return a>0?a:1;
 }
 function apply(){
  var s=zf(); if(s===last)return; last=s;
  var de=document.documentElement;
  de.style.setProperty("--vwidth",(innerWidth/s)+"px");
  de.style.setProperty("--vheight",(innerHeight/s)+"px");
  de.classList.toggle("zfit",s!==1);
  de.classList.toggle("zfit-narrow",(innerWidth/s)<720);
 }
 new MutationObserver(apply).observe(document.documentElement,{attributes:true,attributeFilter:["style"]});
 addEventListener("resize",apply);
 apply();
})();
</script>
