<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>导出配置工具</title>
<style>
:root{--bg:#1e1e1e;--panel:#252526;--border:#333;--fg:#dcddde;--dim:#9aa0a6;--green:#4caf50;--greenBtn:#2d7d46;--red:#f44336;--accent:#569cd6}
*{box-sizing:border-box}
body{font-family:"Segoe UI",system-ui,sans-serif;margin:0;padding:24px;background:var(--bg);color:var(--fg);max-width:980px}
h1{font-size:20px;margin:0 0 6px}
h2{font-size:15px;margin:0 0 12px;color:#fff}
.sub{color:var(--dim);font-size:12px;margin-bottom:14px}
.status{font-size:12px;margin-bottom:18px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#888;margin-right:6px;vertical-align:middle}
.dot.on{background:var(--green)}.dot.off{background:var(--red)}
section{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px}
.sec-title{font-size:12px;color:var(--dim);margin:10px 0 6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
.fld label{display:block;font-size:12px;margin-bottom:4px}
.fld label b{color:#fff;font-weight:600}
.fld .desc{color:var(--dim);font-weight:400}
.fld .row{display:flex;gap:6px}
.fld input{flex:1;min-width:0;font-size:13px;padding:6px 8px;background:#111;border:1px solid var(--border);border-radius:5px;color:var(--fg)}
.fld input:focus{outline:none;border-color:var(--accent)}
.mini{font-size:11px;padding:6px 9px;background:#333;color:var(--fg);border:1px solid #444;border-radius:5px;cursor:pointer;white-space:nowrap}
.mini:hover{background:#3d3d3d}
.actions{margin-top:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
button.primary{font-size:13px;padding:8px 20px;background:var(--greenBtn);color:#fff;border:0;border-radius:6px;cursor:pointer}
button.primary:disabled{background:#555;cursor:default}
button.big{font-size:16px;padding:12px 48px;background:var(--greenBtn);color:#fff;border:0;border-radius:8px;cursor:pointer;display:block;margin:0 auto}
button.big:disabled{background:#555;cursor:wait}
.hint{font-size:12px;color:var(--dim)}
.hint.dirty{color:#e6b450}
#saveMsg{font-size:12px;color:var(--green)}
.badge{display:inline-block;font-size:14px;font-weight:600;padding:6px 16px;border-radius:6px;margin-bottom:12px}
.badge.ok{background:rgba(76,175,80,.15);color:var(--green);border:1px solid var(--green)}
.badge.err{background:rgba(244,67,54,.15);color:var(--red);border:1px solid var(--red)}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.stat{background:#111;border:1px solid var(--border);border-radius:6px;padding:8px 14px;min-width:90px}
.stat .n{font-size:20px;font-weight:700;color:#fff}
.stat.bad .n{color:var(--red)}
.stat .t{font-size:11px;color:var(--dim)}
table.tbl{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:12px}
table.tbl th,table.tbl td{text-align:left;padding:5px 8px;border-bottom:1px solid #2e2e2e}
table.tbl th{color:var(--dim);font-weight:400}
td.ok{color:var(--green)}td.bad{color:var(--red)}
pre{background:#111;border:1px solid var(--border);border-radius:6px;padding:12px;font-size:12px;line-height:1.5;white-space:pre-wrap;max-height:380px;overflow:auto;margin:8px 0}
pre.err{color:#ff8a80}
details summary{font-size:12px;color:var(--dim);cursor:pointer}
footer{color:var(--dim);font-size:11px;margin-top:8px;word-break:break-all}

/* 滑轮缩放自适应（配合页尾 zoomfit 脚本）：zfit 时 body 变为虚拟视口滚动容器 */
html.zfit{overflow:hidden}
html.zfit body{width:min(980px,var(--vwidth));height:var(--vheight);overflow:auto}
.zfit-narrow .grid{grid-template-columns:1fr}
</style>
</head>
<body>
<h1>导出配置工具</h1>
<div class="sub">.duowei 多维表格 → json + C# 直出（duowei_export.py）· 经本地后端 <span id="apiLabel"></span> 执行（侧边栏 ▶ 或 Program/start.bat 启动）</div>
<div class="status"><span class="dot" id="dot"></span><span id="statusText">连接后端中…</span></div>

<section>
 <h2>config.json 配置</h2>
 <div id="fields"></div>
 <div class="actions">
  <button class="primary" id="save" disabled>保存配置</button>
  <span class="hint" id="dirtyHint">—</span>
  <span id="saveMsg"></span>
 </div>
</section>

<section>
 <h2>一键导出</h2>
 <button class="big" id="run">运行导出</button>
 <div class="hint" style="text-align:center;margin-top:8px">执行 uv run GameData/tools/Program/duowei_export.py（配置有未保存修改时会先自动保存）</div>
 <div id="result" style="display:none;margin-top:14px">
  <span class="badge" id="badge"></span>
  <div class="stats" id="stats"></div>
  <table class="tbl" id="tblBox" style="display:none">
   <thead><tr><th>json 表</th><th>状态</th><th>条数</th></tr></thead>
   <tbody id="tblBody"></tbody>
  </table>
  <details><summary>完整输出</summary><pre id="stdout"></pre></details>
  <pre class="err" id="stderr" style="display:none"></pre>
 </div>
</section>

<footer>配置文件：<span id="cfgPath">—</span></footer>

<script>
"use strict";
const $=id=>document.getElementById(id);
const PORT=new URLSearchParams(location.search).get("port")||"8712";
// 从服务打开时用同源相对路径请求（不绑定主机/端口）；file:// 打开时走本地服务绝对地址
const API=location.protocol.startsWith("http")?"":"http://127.0.0.1:"+PORT;
$("apiLabel").textContent=API||location.origin;

// 字段清单：path 为 config.json 内点号路径；「恢复默认」= 恢复为打开页面时的值
const SECTIONS=[
 {title:"路径与命名",fields:[
  {path:"source_dir",      label:"源数据目录",   desc:".duowei 表所在目录（相对配置文件）"},
  {path:"class_map_file",  label:"类名映射文件", desc:"表名→类名映射表（相对配置文件）"},
  {path:"output.json",     label:"json 输出目录",desc:"游戏运行时 json 输出目录"},
  {path:"namespace",       label:"命名空间",     desc:"生成 C# 的 namespace"}]},
 {title:"C# 分类输出目录",fields:[
  {path:"output.cs.core",       label:"Core",      desc:"共用结构：明细类 / 共享 struct / 接口本体"},
  {path:"output.cs.enum",       label:"Enum",      desc:"枚举：select 列推导"},
  {path:"output.cs.event",      label:"Event",     desc:"事件：记录类型表 struct"},
  {path:"output.cs.actor_data", label:"ActorData", desc:"实体数据：数据类 / 子类 / 接口具体类"},
  {path:"output.cs.data",       label:"Data",      desc:"模块数据：记录类型表 class（如 AbstractData 派生）"}]}
];
const ALL_FIELDS=SECTIONS.flatMap(s=>s.fields);
let INITIAL={};

function getPath(obj,path){return path.split(".").reduce((o,k)=>(o==null?undefined:o[k]),obj)}
function setPath(obj,path,v){const ks=path.split(".");let o=obj;for(let i=0;i<ks.length-1;i++){if(typeof o[ks[i]]!=="object"||o[ks[i]]==null)o[ks[i]]={};o=o[ks[i]]}o[ks[ks.length-1]]=v}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function buildForm(){
 const host=$("fields");host.innerHTML="";
 for(const sec of SECTIONS){
  const h=document.createElement("div");h.className="sec-title";h.textContent=sec.title;host.appendChild(h);
  const grid=document.createElement("div");grid.className="grid";
  for(const f of sec.fields){
   const d=document.createElement("div");d.className="fld";
   const lab=document.createElement("label");
   const b=document.createElement("b");b.textContent=f.label;
   const sp=document.createElement("span");sp.className="desc";sp.textContent="　"+f.desc;
   lab.appendChild(b);lab.appendChild(sp);d.appendChild(lab);
   const row=document.createElement("div");row.className="row";
   const inp=document.createElement("input");inp.id="f_"+f.path;inp.dataset.path=f.path;inp.spellcheck=false;
   const btn=document.createElement("button");btn.className="mini";btn.textContent="恢复默认";
   btn.title="恢复为打开页面时的配置值";
   btn.onclick=()=>{inp.value=getPath(INITIAL,f.path)??"";onEdit()};
   row.appendChild(inp);row.appendChild(btn);d.appendChild(row);grid.appendChild(d);
  }
  host.appendChild(grid);
 }
 host.addEventListener("input",onEdit);
}

function collect(){ // 只收集与打开时不同的键 → 后端深度合并（tables 等未编辑字段不丢）
 const out={};
 for(const f of ALL_FIELDS){
  const v=$("f_"+f.path).value.trim();
  if(v!==(getPath(INITIAL,f.path)??""))setPath(out,f.path,v);
 }
 return out;
}

function onEdit(){
 const diff=collect();
 const dirty=Object.keys(diff).length>0;
 $("dirtyHint").textContent=dirty?"有未保存修改":"无未保存修改";
 $("dirtyHint").className="hint"+(dirty?" dirty":"");
 $("save").disabled=!dirty;
}

function fill(cfg){
 for(const f of ALL_FIELDS)$("f_"+f.path).value=getPath(cfg,f.path)??"";
 onEdit();
}

async function jfetch(path,opts,timeout){
 const ctl=new AbortController();
 const tm=setTimeout(()=>ctl.abort(),timeout||30000);
 try{
  const r=await fetch(API+path,Object.assign({},opts,{signal:ctl.signal}));
  return await r.json();
 }finally{clearTimeout(tm)}
}

async function init(){
 buildForm();
 try{
  const p=await jfetch("/ping");
  $("dot").className="dot "+(p.ok?"on":"off");
  $("statusText").textContent=p.ok?("后端就绪（pid "+p.pid+"）"):"后端异常："+p.error;
 }catch(e){
  $("dot").className="dot off";
  $("statusText").textContent="后端未连接——Obsidian 侧边栏 ▶「数据管线启动器」或双击 GameData/tools/Program/start.bat 启动";
  return;
 }
 try{
  const j=await jfetch("/config");
  if(!j.ok)throw new Error(j.error);
  INITIAL=JSON.parse(JSON.stringify(j.config));
  $("cfgPath").textContent=j.config_path;
  fill(j.config);
 }catch(e){
  $("statusText").textContent="配置读取失败："+e.message;
 }
}

async function saveConfig(){ // 返回是否成功（无修改视为成功）
 const diff=collect();
 if(!Object.keys(diff).length)return true;
 let j;
 try{j=await jfetch("/config",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({config:diff})})}
 catch(e){alert("保存失败（后端无响应）："+e.message);return false}
 if(!j.ok){alert("保存失败："+j.error);return false}
 INITIAL=JSON.parse(JSON.stringify(j.config));
 fill(j.config);
 $("saveMsg").textContent="已保存 "+new Date().toLocaleTimeString();
 setTimeout(()=>{$("saveMsg").textContent=""},4000);
 return true;
}

function parseStats(out){ // 解析 duowei_export.py stdout 的「== 导出结果 ==」段
 const tables=[];let records=0;
 const re=/^\s*(\S+)\s+json=(OK|FAIL\S*)\s+条数=(\d+)\s+成员=(\d+)\s+子类=(\d+)$/gm;
 let m;
 while((m=re.exec(out))){tables.push({name:m[1],ok:m[2]==="OK",n:+m[3]});records+=+m[3]}
 const cats=[];let cs=0;
 const cre=/^\s*\[(\w+)\]\s+(\d+)\s+个/gm;
 while((m=cre.exec(out))){cats.push({cat:m[1],n:+m[2]});cs+=+m[2]}
 const fw=(out.match(/FAIL=(\d+)\s+WARN=(\d+)/)||[0,0,0]).slice(1).map(Number);
 return{tables:tables,records:records,cats:cats,cs:cs,fails:fw[0]||0,warns:fw[1]||0};
}

function renderResult(j){
 const st=parseStats(j.stdout||"");
 const ok=j.exit_code===0&&st.fails===0;
 const bd=$("badge");
 bd.className="badge "+(ok?"ok":"err");
 bd.textContent=ok?("导出成功（exit "+j.exit_code+"，耗时 "+(j.duration_ms/1000).toFixed(1)+"s）")
                  :("导出失败（exit "+(j.exit_code==null?"-":j.exit_code)+(j.timed_out?"，超时终止":"")+"）");
 const cards=[
  {n:st.tables.length,t:"json 表",bad:false},
  {n:st.records,t:"记录总数",bad:false},
  {n:st.cs,t:"C# 文件",bad:false},
  {n:st.warns,t:"WARN",bad:false},
  {n:st.fails,t:"FAIL",bad:st.fails>0}
 ];
 $("stats").innerHTML=cards.map(c=>'<div class="stat'+(c.bad?" bad":"")+'"><div class="n">'+c.n+'</div><div class="t">'+c.t+'</div></div>').join("");
 if(st.tables.length){
  $("tblBox").style.display="";
  $("tblBody").innerHTML=st.tables.map(t=>"<tr><td>"+esc(t.name)+"</td><td class='"+(t.ok?"ok":"bad")+"'>"+(t.ok?"OK":"FAIL")+"</td><td>"+t.n+"</td></tr>").join("");
 }else{
  $("tblBox").style.display="none";
 }
 $("stdout").textContent=j.stdout||"(无输出)";
 if(j.stderr){
  $("stderr").style.display="block";
  $("stderr").textContent=j.stderr;
 }else{
  $("stderr").style.display="none";
 }
}

$("save").onclick=()=>{saveConfig()};

$("run").onclick=async()=>{
 if(Object.keys(collect()).length){
  const ok=await saveConfig();
  if(!ok)return; // 保存失败不导出（导出读的是磁盘配置，避免误解）
 }
 const b=$("run"),res=$("result");
 b.disabled=true;b.textContent="正在导出…";
 $("save").disabled=true;
 res.style.display="block";
 $("badge").className="badge";$("badge").textContent="执行中…";
 $("stats").innerHTML="";$("tblBox").style.display="none";
 $("stdout").textContent="";$("stderr").style.display="none";
 let j;
 try{
  j=await jfetch("/export",{method:"POST"},300000);
 }catch(e){
  $("badge").className="badge err";$("badge").textContent="请求失败";
  $("stderr").style.display="block";
  $("stderr").textContent="后端无响应："+e.message+"\n可能：后端未启动——侧边栏 ▶ 或双击 Program/start.bat";
  b.disabled=false;b.textContent="运行导出";onEdit();return;
 }
 renderResult(j);
 b.disabled=false;b.textContent="运行导出";onEdit();
};

init();
</script>

<script>
// 滑轮缩放自适应：HTML Reader 的缩放是给 html 元素加 transform:scale（视口宽度不变、
// 媒体查询不触发、放大后右/下溢出不可达）。此处读取该缩放值，把虚拟视口（实际宽高÷缩放）
// 写入 --vwidth/--vheight 并打 .zfit / .zfit-narrow 标记，布局据此重排为恰好铺满可见区。
(function(){
 var last=-1;
 function zf(){
  var t=getComputedStyle(document.documentElement).transform;
  if(!t||t==="none")return 1;
  var m=t.match(/matrix\(([^)]+)\)/);
  if(!m)return 1;
  var a=parseFloat(m[1].split(",")[0]);
  return a>0?a:1;
 }
 function apply(){
  var s=zf(); if(s===last)return; last=s;
  var de=document.documentElement;
  de.style.setProperty("--vwidth",(innerWidth/s)+"px");
  de.style.setProperty("--vheight",(innerHeight/s)+"px");
  de.classList.toggle("zfit",s!==1);
  de.classList.toggle("zfit-narrow",(innerWidth/s)<720);
 }
 new MutationObserver(apply).observe(document.documentElement,{attributes:true,attributeFilter:["style"]});
 addEventListener("resize",apply);
 apply();
})();
</script>
</body>
</html>
